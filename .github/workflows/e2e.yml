name: Playwright E2E

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/assets/**'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: E2E (desktop Chromium)
        run: npm run e2e -- --project=chromium
        env:
          VITE_ALLOW_DEV_GUEST: 'true'
      - name: Browser evidence (failures only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 3
